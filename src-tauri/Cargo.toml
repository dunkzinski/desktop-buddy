[package]
name = "avatar-desktop"
version = "0.1.0"
description = "AI Avatar Desktop - transparent avatar walking on the desktop, driven by a local HTTP API"
authors = ["Austin Dunkzinski"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "avatar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = ["tauri-runtime-wry"] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "net", "time"] }
axum = "0.7"
# `GET /events`: BroadcastStream adapts the tokio broadcast channel into the
# Stream that axum's SSE response consumes.
tokio-stream = { version = "0.1", features = ["sync"] }
# `src/bin/char-rig-mcp.rs`: blocking HTTP client for the MCP stdio bridge.
# No TLS on purpose — it only ever talks to http://127.0.0.1.
# `stream` feeds `src/bin/char-rig-watcher.rs`, which consumes the SSE body of
# `GET /events` chunk by chunk (`Response::bytes_stream`).
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "stream"] }

# Windows-specific: global cursor polling for selective click-through, plus the
# desktop-context probes behind `GET /context`
#   * GetTickCount64    -> Win32_System_SystemInformation
#   * GetLastInputInfo  -> Win32_UI_Input_KeyboardAndMouse
#   * GetForegroundWindow / GetWindowTextW / GetCursorPos
#                       -> Win32_UI_WindowsAndMessaging
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
] }

# Model importing / rig editor
base64 = "0.22"
rfd = "0.15"
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
