[package]
name = "avatar-desktop"
version = "0.1.0"
description = "AI Avatar Desktop - transparent avatar walking on the desktop, driven by a local HTTP API"
authors = ["Austin Dunkzinski"]
license = "Apache-2.0"
repository = "https://github.com/dunkzinski/desktop-buddy"
homepage = "https://github.com/dunkzinski/desktop-buddy"
edition = "2021"
rust-version = "1.85"

[lib]
name = "avatar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = ["tauri-runtime-wry"] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "net", "time", "process"] }
axum = "0.7"
# `GET /events`: BroadcastStream adapts the tokio broadcast channel into the
# Stream that axum's SSE response consumes.
tokio-stream = { version = "0.1", features = ["sync"] }
# `src/bin/char-rig-mcp.rs`: blocking HTTP client for the MCP stdio bridge.
# No TLS on purpose — it only ever talks to http://127.0.0.1.
# `stream` feeds `src/bin/char-rig-watcher.rs`, which consumes the SSE body of
# `GET /events` chunk by chunk (`Response::bytes_stream`).
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "stream", "rustls-tls"] }
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "std"] }

# Windows-specific: global cursor polling for selective click-through, plus the
# desktop-context probes behind `GET /context`
#   * GetTickCount64    -> Win32_System_SystemInformation
#   * GetLastInputInfo  -> Win32_UI_Input_KeyboardAndMouse
#   * GetForegroundWindow / GetWindowTextW / GetCursorPos / GetWindowThreadProcessId
#                       -> Win32_UI_WindowsAndMessaging
#   * OpenProcess / QueryFullProcessImageNameW
#                       -> Win32_System_Threading  (process_name in /context)
#   * OpenClipboard / GetClipboardData / CF_UNICODETEXT / GlobalLock
#                       -> Win32_System_DataExchange + Win32_System_Ole + Win32_System_Memory
#                          (`GET /clipboard`)
#   * DwmGetWindowAttribute / DWMWA_EXTENDED_FRAME_BOUNDS / DWMWA_CLOAKED
#                       -> Win32_Graphics_Dwm   (undecorated window bounds)
#   * EnumWindows / IsWindowVisible / IsIconic / GetWindowRect
#                       -> Win32_UI_WindowsAndMessaging  (visible_windows)
#   * GetDpiForSystem   -> Win32_UI_HiDpi       (physical px -> CSS px)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Graphics_Dwm",
    "Win32_UI_HiDpi",
    # GDI BitBlt/GetDIBits for the watcher's screen-vision capture
    # (`src/bin/screen.rs`): no DXGI session handshake, works over RDP.
    "Win32_Graphics_Gdi",
] }

# Model importing / rig editor
base64 = "0.22"
rfd = "0.15"
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Cross-platform audio. `rodio` owns playback (WASAPI on Windows, ALSA/Pulse/
# PipeWire on Linux, CoreAudio on macOS — all through cpal, no OS bindings of
# our own) and `cpal` owns microphone capture for push-to-talk.
rodio = { version = "0.19", default-features = false, features = ["wav"] }
cpal = "0.15"

# Cross-platform desktop integration for the non-Windows backends
# (`src/platform/unix.rs`): global hotkeys and the global cursor/key state.
# Windows keeps its native Win32 paths, which are already proven.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
global-hotkey = "0.6"
rdev = "0.5"

# Debug builds compile every dependency at opt-level 0, which is right for our
# own code (breakpoints, quick rebuilds) and catastrophic for Cranelift: building
# one 400 KB plugin module in wasmtime took ~4.5 s per plugin in that profile, and
# every launch paid it again (9 s of a 10 s startup). Optimising *only* the
# dependencies keeps `avatar-desktop` itself debuggable while making plugin
# instantiation, JSON parsing and image decoding production-fast.
[profile.dev.package."*"]
opt-level = 2
