<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Avatar Desktop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    #titlebar { position: fixed; top: 0; left: 0; right: 0; height: 36px; display: flex; align-items: center; justify-content: flex-end; padding: 0 12px; z-index: 1000; -webkit-app-region: drag; background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, transparent 100%); border-bottom: 1px solid rgba(255,255,255,0.08); pointer-events: auto; }
    #titlebar .window-controls { display: flex; gap: 4px; -webkit-app-region: no-drag; }
    #titlebar .window-btn { width: 28px; height: 28px; border: none; border-radius: 6px; background: transparent; color: rgba(255,255,255,0.85); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; transition: all 0.15s ease; }
    #titlebar .window-btn:hover { background: rgba(255,255,255,0.15); color: white; }
    #titlebar .window-btn.close:hover { background: #e81123; color: white; }
    #titlebar .window-btn:active { transform: scale(0.95); }
    #titlebar .window-btn svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2; fill: none; }
    #control-panel { position: fixed; bottom: 20px; right: 20px; width: 280px; background: rgba(18, 18, 24, 0.92); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 16px; z-index: 100; color: #e8e8ed; pointer-events: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05); transform: translateX(0); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    #control-panel.collapsed { transform: translateX(calc(100% + 20px)); }
    #control-panel header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    #control-panel h2 { font-size: 14px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; color: #a0a0b0; }
    #control-panel .toggle-btn { width: 24px; height: 24px; border: none; border-radius: 6px; background: rgba(255,255,255,0.08); color: #a0a0b0; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s ease; }
    #control-panel .toggle-btn:hover { background: rgba(255,255,255,0.15); color: white; }
    .control-section { margin-bottom: 16px; }
    .control-section:last-child { margin-bottom: 0; }
    .control-section label { display: block; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: #707080; margin-bottom: 8px; }
    .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .btn-grid.wide { grid-template-columns: 1fr; }
    .control-btn { padding: 10px 12px; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; background: rgba(255,255,255,0.05); color: #e8e8ed; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s ease; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .control-btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.2); }
    .control-btn:active { transform: scale(0.98); }
    .control-btn.active { background: rgba(74, 144, 217, 0.3); border-color: #4a90d9; color: #4a90d9; }
    .control-btn.primary { background: linear-gradient(135deg, #4a90d9, #357abd); border-color: transparent; color: white; }
    .control-btn.primary:hover { background: linear-gradient(135deg, #5aa0e9, #4a90d9); }
    .control-btn.danger:hover { background: rgba(232, 17, 35, 0.3); border-color: #e81123; color: #e81123; }

    .slider-container input[type="range"] { flex: 1; height: 6px; -webkit-appearance: none; appearance: none; background: rgba(255,255,255,0.1); border-radius: 3px; outline: none; }
    .slider-container input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #4a90d9; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.3); transition: transform 0.1s ease, box-shadow 0.1s ease; }

    .slider-value { font-size: 12px; font-variant-numeric: tabular-nums; color: #a0a0b0; min-width: 40px; text-align: right; }

    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 8px #4ade80; animation: pulse 2s infinite; }

    .status-text .label { color: #707080; font-size: 11px; }

    #panel-toggle svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2.5; }
    .clickable { pointer-events: auto; }
    body:not(.ui-hover) canvas { pointer-events: none; }
    body.ui-hover canvas { pointer-events: none; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="titlebar" class="clickable">
  <div class="window-controls">
    <button class="window-btn minimize" id="btn-minimize" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    <button class="window-btn close" id="btn-close" title="Close" aria-label="Close"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
</div>
<div id="control-panel" class="clickable">
  <header>
    <h2>Avatar Control</h2>
    <button class="toggle-btn" id="btn-collapse" aria-label="Collapse panel" title="Collapse"><svg viewBox="0 0 24 24" width="16" height="16"><polyline points="15 18 9 12 15 6"/></svg></button>
  </header>
  <div class="status-indicator">
    <div class="status-dot" id="status-dot"></div>
    <div class="status-text">
      <div><span class="label">State:</span> <span id="status-state">Idle</span></div>
      <div><span class="label">Expression:</span> <span id="status-expression">Neutral</span></div>
    </div>
  </div>
  <div class="control-section">
    <label>Expression</label>
    <div class="btn-grid">
      <button class="control-btn" data-expression="neutral" title="Neutral">😐 Neutral</button>
      <button class="control-btn" data-expression="happy" title="Happy">😊 Happy</button>
      <button class="control-btn" data-expression="sad" title="Sad">😢 Sad</button>
      <button class="control-btn" data-expression="surprised" title="Surprised">😲 Surprised</button>
    </div>
  </div>
  <div class="control-section">
    <label>Actions</label>
    <div class="btn-grid">
      <button class="control-btn primary" id="btn-wave" title="Wave">👋 Wave</button>
      <button class="control-btn" id="btn-idle" title="Return to Idle">⏸ Idle</button>
      <button class="control-btn" id="btn-walk-random" title="Walk to Random Position">🚶 Walk Random</button>
      <button class="control-btn danger" id="btn-center" title="Return to Center">🎯 Center</button>
    </div>
  </div>
  <div class="control-section">
    <label>Walk Speed</label>
    <div class="slider-container">
      <input type="range" id="walk-speed" min="50" max="400" value="150" step="10">
      <span class="slider-value" id="walk-speed-value">150 px/s</span>
    </div>
  </div>
  <div class="control-section">
    <label>Position</label>
    <div class="btn-grid wide">
      <button class="control-btn" id="btn-get-pos" title="Get Current Position">📍 Get Position</button>
    </div>
    <div style="margin-top: 8px; font-size: 11px; color: #707080;" id="position-display">Loading...</div>
  </div>
</div>
<button id="panel-toggle" class="clickable" aria-label="Expand control panel" title="Show Controls"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>

if (isTauri) { listen('avatar-state-changed', (event) => { const state = event.payload; if (state.position) { position.x = state.position[0]; position.y = state.position[1]; } if (state.target_position) { targetPosition.x = state.target_position[0]; targetPosition.y = state.target_position[1]; walkStartPosition = { ...position }; walkStartTime = animationTime; } if (state.state) { avatarState = state.state; if (state.state === 'waving') wavePhase = 0; } if (state.expression) { setExpression(state.expression); } updateStatusUI(); }).catch(console.error); listen('window-resized', () => { resize(); }).catch(console.error); }
function updateStatusUI() { const stateEl = document.getElementById('status-state'); const exprEl = document.getElementById('status-expression'); if (stateEl) stateEl.textContent = avatarState.charAt(0).toUpperCase() + avatarState.slice(1); let exprName = 'Neutral'; if (targetBlendshapes.mouth_open > 0.7) exprName = 'Surprised'; else if (targetBlendshapes.mouth_open > 0.4) exprName = 'Happy'; else if (targetBlendshapes.brow_up > 0.4) exprName = 'Sad'; if (exprEl) exprEl.textContent = exprName; document.querySelectorAll('[data-expression]').forEach(btn => { btn.classList.toggle('active', btn.dataset.expression === getCurrentExpression()); }); }
function getCurrentExpression() { if (targetBlendshapes.mouth_open > 0.7) return 'surprised'; if (targetBlendshapes.mouth_open > 0.4) return 'happy'; if (targetBlendshapes.brow_up > 0.4) return 'sad'; return 'neutral'; }
function updatePositionDisplay() { const el = document.getElementById('position-display'); if (el) el.textContent = 'Current: (' + Math.round(position.x) + ', ' + Math.round(position.y) + ') | Target: (' + Math.round(targetPosition.x) + ', ' + Math.round(targetPosition.y) + ')'; }
function setupUI() { document.getElementById('btn-close').addEventListener('click', async () => { await invokeTauri('close_window'); }); document.getElementById('btn-minimize').addEventListener('click', async () => { await invokeTauri('minimize_window'); }); document.querySelectorAll('[data-expression]').forEach(btn => { btn.addEventListener('click', async () => { const expr = btn.dataset.expression; setExpression(expr); await invokeTauri('set_avatar_expression', { expression: expr }); updateStatusUI(); }); }); document.getElementById('btn-wave').addEventListener('click', async () => { await invokeTauri('trigger_wave'); }); document.getElementById('btn-idle').addEventListener('click', async () => { avatarState = 'idle'; await invokeTauri('set_avatar_state', { new_state: 'idle' }); updateStatusUI(); }); document.getElementById('btn-walk-random').addEventListener('click', async () => { const x = randomRange(100, screenWidth - 100); const y = randomRange(100, screenHeight - 100); targetPosition = { x, y }; walkStartPosition = { ...position }; walkStartTime = animationTime; avatarState = 'walking'; walkCyclePhase = 0; setExpression('surprised'); await invokeTauri('set_avatar_position', { x, y }); updateStatusUI(); }); document.getElementById('btn-center').addEventListener('click', async () => { const x = screenWidth / 2; const y = screenHeight / 2; targetPosition = { x, y }; walkStartPosition = { ...position }; walkStartTime = animationTime; avatarState = 'walking'; walkCyclePhase = 0; setExpression('surprised'); await invokeTauri('set_avatar_position', { x, y }); updateStatusUI(); }); document.getElementById('btn-get-pos').addEventListener('click', async () => { const state = await invokeTauri('get_avatar_state'); if (state) { position.x = state.position[0]; position.y = state.position[1]; targetPosition.x = state.target_position[0]; targetPosition.y = state.target_position[1]; updatePositionDisplay(); } }); const speedSlider = document.getElementById('walk-speed'); const speedValue = document.getElementById('walk-speed-value'); speedSlider.addEventListener('input', (e) => { WALK_SPEED = parseInt(e.target.value); speedValue.textContent = WALK_SPEED + ' px/s'; }); const panel = document.getElementById('control-panel'); const toggle = document.getElementById('panel-toggle'); const collapseBtn = document.getElementById('btn-collapse'); function setCollapsed(collapsed) { panelCollapsed = collapsed; panel.classList.toggle('collapsed', collapsed); toggle.classList.toggle('visible', collapsed); collapseBtn.innerHTML = collapsed ? '<svg viewBox="0 0 24 24" width="16" height="16"><polyline points="9 18 15 12 9 6"/></svg>' : '<svg viewBox="0 0 24 24" width="16" height="16"><polyline points="15 18 9 12 15 6"/></svg>'; collapseBtn.setAttribute('aria-label', collapsed ? 'Expand panel' : 'Collapse panel'); collapseBtn.title = collapsed ? 'Expand' : 'Collapse'; } collapseBtn.addEventListener('click', () => setCollapsed(!panelCollapsed)); toggle.addEventListener('click', () => setCollapsed(false)); document.querySelectorAll('.clickable').forEach(el => { el.addEventListener('mouseenter', () => { uiHovered = true; document.body.classList.add('ui-hover'); }); el.addEventListener('mouseleave', () => { uiHovered = false; document.body.classList.remove('ui-hover'); }); }); document.getElementById('titlebar').addEventListener('mouseenter', () => { uiHovered = true; document.body.classList.add('ui-hover'); }); document.getElementById('titlebar').addEventListener('mouseleave', () => { uiHovered = false; document.body.classList.remove('ui-hover'); }); window.addEventListener('keydown', (e) => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return; switch(e.key.toLowerCase()) { case '1': setExpression('happy'); invokeTauri('set_avatar_expression', { expression: 'happy' }); break; case '2': setExpression('sad'); invokeTauri('set_avatar_expression', { expression: 'sad' }); break; case '3': setExpression('surprised'); invokeTauri('set_avatar_expression', { expression: 'surprised' }); break; case '4': setExpression('neutral'); invokeTauri('set_avatar_expression', { expression: 'neutral' }); break; case 'w': targetPosition = { x: screenWidth/2 + 300, y: screenHeight/2 }; walkStartPosition = { ...position }; walkStartTime = animationTime; avatarState = 'walking'; walkCyclePhase = 0; setExpression('surprised'); invokeTauri('set_avatar_position', targetPosition); break; case 'i': avatarState = 'idle'; invokeTauri('set_avatar_state', { new_state: 'idle' }); break; case ' ': avatarState = 'waving'; wavePhase = 0; invokeTauri('trigger_wave'); break; case 'escape': panelCollapsed ? setCollapsed(false) : setCollapsed(true); break; } updateStatusUI(); }); }
async function init() { resize(); setExpression('neutral'); setupUI(); updateStatusUI(); updatePositionDisplay(); if (isTauri) await syncStateFromBackend(); requestAnimationFrame(loop); } init();
